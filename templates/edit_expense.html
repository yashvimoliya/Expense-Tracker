<!DOCTYPE html>
<html>

<head>
    <title>Edit Expense</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow">

            <div class="card-header bg-warning">
                <h3>Edit Expense</h3>
            </div>

            <div class="card-body">

                <form action="/update/{{ expense[0] }}" method="POST">

                    <div class="mb-3">
                        <label>Date</label>
                        <input type="date" name="date" value="{{ expense[1] }}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Category</label>
                        <input type="text" name="category" value="{{ expense[2] }}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Amount</label>
                        <input type="number" step="0.01" name="amount" value="{{ expense[3] }}" class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label>Description</label>
                        <textarea name="description" class="form-control">{{ expense[4] }}</textarea>
                    </div>

                    <button class="btn btn-success">
                        Update Expense
                    </button>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
