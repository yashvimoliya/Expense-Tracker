<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Expense</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f8fc;
            color: #102a43;
        }

        .main {
            max-width: 750px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #e1eaf2;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d7e1e9;
            border-radius: 7px;
            box-sizing: border-box;
        }

        button {
            margin-top: 22px;
            background: #0878ed;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-left: 10px;
            color: #0878ed;
            text-decoration: none;
        }

    </style>

</head>

<body>


<div class="main">

    <h1>
        Edit Expense
    </h1>

    <p>
        Update your expense details.
    </p>


    <form
        action="/update/{{ expense[0] }}"
        method="POST"
    >


        <label>
            Date
        </label>

        <input
            type="date"
            name="date"
            value="{{ expense[1] }}"
            required
        >


        <label>
            Category
        </label>

        <input
            type="text"
            name="category"
            value="{{ expense[2] }}"
            required
        >


        <label>
            Amount
        </label>

        <input
            type="number"
            step="0.01"
            name="amount"
            value="{{ expense[3] }}"
            required
        >


        <label>
            Description
        </label>

        <input
            type="text"
            name="description"
            value="{{ expense[4] }}"
        >


        <button type="submit">
            Save Changes
        </button>


        <a href="/expenses">
            Cancel
        </a>


    </form>

</div>

</body>

</html>
