<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Personal Expense Tracker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #2563eb,
                #4f46e5
            );
        }

        .card {
            width: 430px;
            background: white;

            border-radius: 20px;

            padding: 40px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.20);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #111827;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .message {
            background: #eff6ff;
            color: #1d4ed8;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 14px;
        }

        label {
            display: block;

            color: #374151;

            font-weight: 600;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            font-size: 15px;

            margin-bottom: 18px;
        }

        input:focus {
            outline: none;

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            text-align: center;

            margin-top: 22px;
        }

        .back a {
            color: #2563eb;

            text-decoration: none;

            font-size: 14px;

            font-weight: 500;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">
        🔐
    </div>

    <h1>
        Forgot Password?
    </h1>

    <p class="subtitle">
        Enter your username and registered email
        to create a new password.
    </p>

    {% if message %}
        <div class="message">
            {{ message }}
        </div>
    {% endif %}

    <form action="/forgot-password" method="POST">

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter your username"
            required
        >


        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            placeholder="Enter your registered email"
            required
        >


        <label>
            New Password
        </label>

        <input
            type="password"
            name="new_password"
            placeholder="Enter new password"
            required
        >


        <label>
            Confirm New Password
        </label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm new password"
            required
        >


        <button type="submit">
            Reset Password
        </button>

    </form>


    <div class="back">
        <a href="/login">
            ← Back to Login
        </a>
    </div>

</div>

</body>
</html>
